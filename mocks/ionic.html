<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hall Aircon · Ionic</title>
<!-- Ionic 9.0.10 (MIT). Adaptive styling: iOS look on Apple devices, Material elsewhere; toggle below to compare. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@ionic/core@9.0.10/css/ionic.bundle.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@ionic/core@9.0.10/css/palettes/dark.class.css">
<script type="module" src="https://cdn.jsdelivr.net/npm/@ionic/core@9.0.10/dist/ionic/ionic.esm.js"></script>
<style>
  .setpoint { text-align: center; padding: 8px 0 0; }
  .setpoint .num { font-size: 72px; font-weight: 700; line-height: 1; letter-spacing: -2px; }
  .setpoint .num sup { font-size: 28px; vertical-align: 36px; letter-spacing: 0; }
  .stepper { display: flex; align-items: center; gap: 8px; padding: 0 8px; }
  .stepper ion-range { flex: 1; }
  .amount { font-size: 28px; font-weight: 700; }
  .qr { width: 180px; height: 180px; margin: 16px auto; border-radius: 12px; border: 10px solid #fff; background: repeating-linear-gradient(90deg, #111 0 6px, transparent 6px 12px), repeating-linear-gradient(0deg, #111 0 6px, transparent 6px 14px), #fff; }
  .center { text-align: center; }
  /* Phone uses the bottom tab bar; from md (768px) the split pane shows the side menu instead */
  @media (min-width: 768px) { .phone-tabs { display: none; } }
  ion-grid { max-width: 1400px; }
  /* MD segment buttons default to a 90px minimum, too wide for four in a phone-width card */
  ion-segment-button { min-width: 0; }
</style>
</head>
<body>
<div id="host"></div>

<template id="app-template">
  <ion-app>
    <ion-split-pane when="md" content-id="main">
      <ion-menu content-id="main" type="overlay">
        <ion-header><ion-toolbar><ion-title>Hall Aircon</ion-title></ion-toolbar></ion-header>
        <ion-content>
          <ion-list lines="none">
            <ion-menu-toggle auto-hide="false">
              <ion-item button detail="false" color="light"><ion-icon slot="start" name="home-outline"></ion-icon><ion-label>Room</ion-label></ion-item>
              <ion-item button detail="false"><ion-icon slot="start" name="stats-chart-outline"></ion-icon><ion-label>Usage</ion-label></ion-item>
              <ion-item button detail="false"><ion-icon slot="start" name="wallet-outline"></ion-icon><ion-label>Wallet</ion-label><ion-badge slot="end" color="warning">S$2.40</ion-badge></ion-item>
              <ion-item button detail="false"><ion-icon slot="start" name="qr-code-outline"></ion-icon><ion-label>Pairing</ion-label></ion-item>
            </ion-menu-toggle>
          </ion-list>
          <ion-list inset>
            <ion-list-header><ion-label>Display</ion-label></ion-list-header>
            <ion-item><ion-toggle class="dark-toggle">Dark mode</ion-toggle></ion-item>
            <ion-item>
              <ion-segment class="mode-switch" value="auto">
                <ion-segment-button value="auto"><ion-label>Auto</ion-label></ion-segment-button>
                <ion-segment-button value="ios"><ion-label>iOS</ion-label></ion-segment-button>
                <ion-segment-button value="md"><ion-label>MD</ion-label></ion-segment-button>
              </ion-segment>
            </ion-item>
          </ion-list>
        </ion-content>
      </ion-menu>

      <div class="ion-page" id="main">
        <ion-header>
          <ion-toolbar>
            <ion-buttons slot="start"><ion-menu-button></ion-menu-button></ion-buttons>
            <ion-title>H11-XX-XX-XXXX</ion-title>
            <ion-buttons slot="end"><ion-button><ion-icon slot="icon-only" name="notifications-outline"></ion-icon></ion-button></ion-buttons>
          </ion-toolbar>
        </ion-header>

        <ion-content class="ion-padding">
          <ion-card color="warning">
            <ion-card-content><strong>Low balance.</strong> S$2.40 left. The aircon switches off at S$0.</ion-card-content>
          </ion-card>

          <ion-grid>
            <ion-row>
              <ion-col size="12" size-lg="6" size-xl="4">
                <ion-card>
                  <ion-card-header>
                    <ion-card-subtitle>Setpoint</ion-card-subtitle>
                    <ion-card-title>Cooling <ion-badge class="pending" color="medium" style="display:none">Sending…</ion-badge></ion-card-title>
                  </ion-card-header>
                  <ion-card-content>
                    <div class="setpoint"><span class="num"><span class="sp">24</span><sup>°C</sup></span><p>Room 26 °C</p></div>
                    <div class="stepper">
                      <ion-button class="minus" fill="outline" shape="round"><ion-icon slot="icon-only" name="remove-outline"></ion-icon></ion-button>
                      <ion-range class="range" min="22" max="26" step="1" value="24" ticks snaps pin aria-label="Setpoint"></ion-range>
                      <ion-button class="plus" fill="outline" shape="round"><ion-icon slot="icon-only" name="add-outline"></ion-icon></ion-button>
                    </div>
                    <ion-button expand="block" color="danger" class="power"><ion-icon slot="start" name="power-outline"></ion-icon><span>Turn off</span></ion-button>
                  </ion-card-content>
                </ion-card>
              </ion-col>

              <ion-col size="12" size-lg="6" size-xl="4">
                <ion-card>
                  <ion-card-header><ion-card-title>Operation</ion-card-title></ion-card-header>
                  <ion-card-content>
                    <ion-segment value="C">
                      <ion-segment-button value="C" layout="icon-top"><ion-icon name="snow-outline"></ion-icon><ion-label>Cool</ion-label></ion-segment-button>
                      <ion-segment-button value="F" layout="icon-top"><ion-icon name="refresh-outline"></ion-icon><ion-label>Fan</ion-label></ion-segment-button>
                      <ion-segment-button value="A" layout="icon-top"><ion-icon name="sync-outline"></ion-icon><ion-label>Auto</ion-label></ion-segment-button>
                      <ion-segment-button value="D" layout="icon-top"><ion-icon name="water-outline"></ion-icon><ion-label>Dry</ion-label></ion-segment-button>
                    </ion-segment>
                    <ion-list lines="full">
                      <ion-item><ion-range label="Fan" label-placement="start" min="0" max="5" step="1" value="2" ticks snaps pin></ion-range></ion-item>
                      <ion-item><ion-toggle>Swing flap</ion-toggle></ion-item>
                    </ion-list>
                  </ion-card-content>
                </ion-card>
              </ion-col>

              <ion-col size="12" size-lg="6" size-xl="4">
                <ion-card>
                  <ion-card-header><ion-card-subtitle>Wallet</ion-card-subtitle><ion-card-title class="amount">S$2.40</ion-card-title></ion-card-header>
                  <ion-card-content>
                    <ion-progress-bar value="0.05" color="warning"></ion-progress-bar>
                    <p>Today S$1.24 · 3h 10m</p>
                    <ion-button expand="block" class="topup"><ion-icon slot="start" name="qr-code-outline"></ion-icon>Top up with PayNow</ion-button>
                  </ion-card-content>
                </ion-card>
                <ion-list inset>
                  <ion-item><ion-icon slot="start" name="wifi-outline"></ion-icon><ion-label>Connection</ion-label><ion-badge slot="end" color="success">Online</ion-badge></ion-item>
                  <ion-item><ion-icon slot="start" name="person-outline"></ion-icon><ion-label>Remote bills</ion-label><ion-note slot="end">You</ion-note></ion-item>
                  <ion-item><ion-icon slot="start" name="time-outline"></ion-icon><ion-label>Auto-off</ion-label><ion-note slot="end">11:00</ion-note></ion-item>
                </ion-list>
              </ion-col>

              <ion-col size="12" size-lg="6" size-xl="12">
                <ion-list inset>
                  <ion-list-header><ion-label>History</ion-label></ion-list-header>
                  <ion-item><ion-icon slot="start" name="snow-outline" color="primary"></ion-icon><ion-label><h3>Cooling 01:15 – 04:25</h3><p>190 min · from web</p></ion-label><ion-note slot="end">−S$1.24</ion-note></ion-item>
                  <ion-item><ion-icon slot="start" name="flash-outline" color="warning"></ion-icon><ion-label><h3>Turned on by remote</h3><p>22:00 – 00:30 · 150 min</p></ion-label><ion-note slot="end">−S$0.98</ion-note></ion-item>
                  <ion-item><ion-icon slot="start" name="wallet-outline" color="success"></ion-icon><ion-label><h3>PayNow top-up</h3><p>28 Oct · 22:25</p></ion-label><ion-note slot="end" color="success">+S$10.00</ion-note></ion-item>
                </ion-list>
              </ion-col>
            </ion-row>
          </ion-grid>
        </ion-content>

        <ion-footer class="phone-tabs">
          <ion-tab-bar selected-tab="room">
            <ion-tab-button tab="room"><ion-icon name="home-outline"></ion-icon><ion-label>Room</ion-label></ion-tab-button>
            <ion-tab-button tab="usage"><ion-icon name="stats-chart-outline"></ion-icon><ion-label>Usage</ion-label></ion-tab-button>
            <ion-tab-button tab="wallet"><ion-icon name="wallet-outline"></ion-icon><ion-label>Wallet</ion-label></ion-tab-button>
            <ion-tab-button tab="pairing"><ion-icon name="qr-code-outline"></ion-icon><ion-label>Pairing</ion-label></ion-tab-button>
          </ion-tab-bar>
        </ion-footer>
      </div>
    </ion-split-pane>

    <!-- Full-screen on phones, a centred card from md up: Ionic does this switch itself -->
    <ion-modal class="topup-modal">
      <ion-header><ion-toolbar><ion-title>Top up</ion-title><ion-buttons slot="end"><ion-button class="close">Close</ion-button></ion-buttons></ion-toolbar></ion-header>
      <ion-content class="ion-padding">
        <ion-segment value="10">
          <ion-segment-button value="10"><ion-label>S$10</ion-label></ion-segment-button>
          <ion-segment-button value="20"><ion-label>S$20</ion-label></ion-segment-button>
          <ion-segment-button value="30"><ion-label>S$30</ion-label></ion-segment-button>
          <ion-segment-button value="40"><ion-label>S$40</ion-label></ion-segment-button>
          <ion-segment-button value="50"><ion-label>S$50</ion-label></ion-segment-button>
        </ion-segment>
        <div class="qr" aria-label="PayNow QR placeholder"></div>
        <p class="center">Scan with your banking app. Expires in <strong>14:32</strong>.<br>Nothing is charged until you confirm in your bank.</p>
      </ion-content>
    </ion-modal>
  </ion-app>
</template>

<script type="module">
  const host = document.getElementById("host");
  const tpl = document.getElementById("app-template");
  let dark = matchMedia("(prefers-color-scheme: dark)").matches;
  let mode = "auto";

  // Ionic reads a component's mode when it's created, so switching iOS/Material re-mounts the app
  function mount() {
    const frag = tpl.content.cloneNode(true);
    if (mode !== "auto") frag.querySelectorAll("*").forEach((el) => { if (el.tagName.startsWith("ION-")) el.setAttribute("mode", mode); });
    host.replaceChildren(frag);
    wire();
  }

  function wire() {
    const $ = (s) => host.querySelector(s);
    document.documentElement.classList.toggle("ion-palette-dark", dark);
    const darkToggle = $(".dark-toggle");
    darkToggle.checked = dark;
    darkToggle.addEventListener("ionChange", (e) => { dark = e.detail.checked; document.documentElement.classList.toggle("ion-palette-dark", dark); });
    const modeSwitch = $(".mode-switch");
    modeSwitch.value = mode;
    modeSwitch.addEventListener("ionChange", (e) => { mode = e.detail.value; mount(); });

    let sp = 24, t;
    const range = $(".range"), spEl = $(".sp"), pending = $(".pending");
    const set = (v) => {
      sp = Math.min(26, Math.max(22, v));
      range.value = sp; spEl.textContent = sp;
      pending.style.display = ""; clearTimeout(t);
      t = setTimeout(() => (pending.style.display = "none"), 5000);
    };
    range.addEventListener("ionInput", (e) => { spEl.textContent = e.detail.value; });
    range.addEventListener("ionChange", (e) => set(e.detail.value));
    $(".minus").addEventListener("click", () => set(sp - 1));
    $(".plus").addEventListener("click", () => set(sp + 1));

    const modal = $(".topup-modal");
    $(".topup").addEventListener("click", () => modal.present());
    $(".close").addEventListener("click", () => modal.dismiss());

    const power = $(".power");
    let on = true;
    power.addEventListener("click", () => {
      on = !on;
      power.color = on ? "danger" : "primary";
      power.querySelector("span").textContent = on ? "Turn off" : "Turn on";
    });
  }

  mount();
</script>
</body>
</html>
